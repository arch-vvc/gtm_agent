services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gtm
    ports:
      - "5432:5432"
    volumes:
      - gtm_pgdata:/var/lib/postgresql

  redis:
    image: redis:7

  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file:
      - .env
    command: ["/app/.venv/bin/python", "worker.py"]
    restart: unless-stopped

volumes:
  gtm_pgdata:
    name: gtm_pgdata