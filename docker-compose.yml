services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gtm
    ports:
      - "5432:5432"
    volumes:
      - gtm_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gtm"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["/app/.venv/bin/python", "worker.py"]
    restart: unless-stopped

volumes:
  gtm_pgdata:
    name: gtm_pgdata