[project]
name = "gtm-agent"
version = "0.1.0"
description = "Company enrichment API: scrapes a website and uses Gemini, with a Groq fallback, to fill in industry, what they sell and who they sell to."
readme = "README.md"
authors = [
    { name = "arch-vvc", email = "archit.rishabh25@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "fastapi>=0.143.3",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gtm-agent = "gtm_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
