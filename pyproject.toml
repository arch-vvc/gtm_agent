[project]
name = "gtm-agent"
version = "0.1.0"
description = "Pitch engine for forward deployed engineer outreach: scrapes a startup site, asks Gemini (Groq as fallback) for its cluster, deployment pain and a grounded pitch note."
readme = "README.md"
authors = [
    { name = "arch-vvc", email = "archit.rishabh25@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "fastapi>=0.143.3",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
