[project]
name = "gtm-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arch-vvc", email = "pes1ug23am062@pesu.pes.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "fastapi>=0.143.3",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
gtm-agent = "gtm_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
